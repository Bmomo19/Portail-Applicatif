stages:
  - build
  - test
  - code_analysis
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375 
  DOCKER_DRIVER: overlay2
  
  # Configuration SonarQube/Cache
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

services:
  - docker:dind

sonar-analysis-Portail:
  stage: code_analysis 
  image: 
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""] 
  tags:
    - docker 
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/ 
      
  script: 
    - sonar-scanner -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.token=${SONAR_TOKEN} -Dsonar.projectKey=portail_portail_09bcf817-c41b-4c96-992a-00d6a64177cc -Dsonar.projectName="Portail - ${CI_COMMIT_REF_NAME}" -Dsonar.gitlab.api_url=${CI_API_V4_URL}
    
  allow_failure: false 
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
